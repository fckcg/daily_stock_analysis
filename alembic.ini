# ===================================
# Alembic 配置（May 2026 audit Top 2: 数据库迁移）
# ===================================
# 实际的 sqlalchemy.url 由 alembic/env.py 在运行时从 ``DatabaseManager``
# 读取（取自 .env / Config），这里的占位符仅用于本地手动调试。

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
sqlalchemy.url = sqlite:///stock_analysis.db
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40

# 不让 alembic 自动启动 transactional DDL —— SQLite 的 ALTER TABLE 在事务里行为
# 不一致（例如不能 DROP COLUMN），由我们的 migration 自行决定边界。
transaction_per_migration = true

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s | %(levelname)-7s | [alembic] %(message)s
datefmt = %H:%M:%S
